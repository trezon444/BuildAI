<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuildAI — Editor</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

body{
    background:#050505;
    color:#fff;
    min-height:100vh;
}

header{
    height:60px;
    background:#0b0b0b;
    border-bottom:1px solid #222;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
}

.logo{
    color:#00c8ff;
    font-size:21px;
    font-weight:bold;
}

.actions button{
    padding:9px 12px;
    margin-left:5px;
    border:0;
    border-radius:8px;
    cursor:pointer;
}

.back{background:#181818;color:#fff}
.save{background:#00bfff;color:#000}

.editor{
    display:grid;
    grid-template-columns:42% 58%;
    min-height:calc(100vh - 60px);
}

.left{
    border-right:1px solid #222;
    padding:15px;
}

.right{
    padding:15px;
}

h2{
    font-size:19px;
    margin-bottom:12px;
}

textarea{
    width:100%;
    height:calc(100vh - 150px);
    resize:none;
    background:#080808;
    color:#ddd;
    border:1px solid #292929;
    border-radius:10px;
    padding:15px;
    outline:none;
    font-family:monospace;
    font-size:13px;
}

textarea:focus{
    border-color:#00aaff;
}

.preview{
    width:100%;
    height:calc(100vh - 120px);
    background:white;
    border:0;
    border-radius:10px;
}

@media(max-width:750px){
    .editor{
        grid-template-columns:1fr;
    }

    .left{
        border-right:0;
        border-bottom:1px solid #222;
    }

    textarea{
        height:400px;
    }

    .preview{
        height:500px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🤖 BuildAI Editor</div>

    <div class="actions">
        <button class="back" onclick="goDashboard()">Dashboard</button>
        <button class="save" onclick="saveProject()">Save</button>
    </div>
</header>

<div class="editor">

    <div class="left">

        <h2>💻 Generated Code</h2>

        <textarea id="code" oninput="updatePreview()"></textarea>

    </div>

    <div class="right">

        <h2>👁️ Live Preview</h2>

        <iframe id="preview" class="preview"></iframe>

    </div>

</div>

<script>

const codeBox = document.getElementById("code");
const preview = document.getElementById("preview");

let code =
    localStorage.getItem("generatedCode") || "";

codeBox.value = code;

function updatePreview(){

    preview.srcdoc = codeBox.value;

}

function saveProject(){

    const code = codeBox.value;

    localStorage.setItem(
        "generatedCode",
        code
    );

    let projects =
        JSON.parse(
            localStorage.getItem("buildaiProjects") || "[]"
        );

    const project = {
        id:Date.now(),
        name:"BuildAI Project",
        code:code,
        createdAt:new Date().toISOString()
    };

    projects.push(project);

    localStorage.setItem(
        "buildaiProjects",
        JSON.stringify(projects)
    );

    alert("Project saved!");

}

function goDashboard(){

    window.location.href =
        "dashboard.html";

}

updatePreview();

</script>

</body>
</html>
